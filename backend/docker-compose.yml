# Phase 2 : Redis rejoint FlareSolverr en conteneur.
# Le backend FastAPI et le worker RQ tournent toujours en local (venv), pas
# en conteneur, pour garder un accès simple et natif au GPU (Whisper).

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - "8191:8191"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
